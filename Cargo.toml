[package]
name = "flashinfer-rs"
version = "0.1.0"
edition = "2021"
authors = ["vasia123"]
license = "Apache-2.0"
description = "Rust bindings for FlashInfer - high-performance attention kernels for LLM inference"
repository = "https://github.com/vasia123/flashinfer-rs"
keywords = ["llm", "attention", "cuda", "flashinfer", "inference"]
categories = ["science", "mathematics", "external-ffi-bindings"]
readme = "README.md"
build = "build.rs"

[features]
default = []

# Core CUDA support - enables GPU operations
cuda = ["dep:cudarc"]

# CUDA version selection (mutually exclusive)
cuda-11 = ["cuda"]
cuda-12 = ["cuda"]

# GPU architecture targets (can combine multiple)
sm80 = ["cuda"]  # Ampere (A100, RTX 30xx)
sm90 = ["cuda"]  # Hopper (H100, H200)

[dependencies]
thiserror = "1.0"
half = { version = "2.3", features = ["num-traits"] }

# Optional CUDA support
cudarc = { version = "0.12", optional = true }

[build-dependencies]
cc = { version = "1.0", features = ["parallel"] }
bindgen = "0.69"

[dev-dependencies]
candle-core = "0.8"

[package.metadata.docs.rs]
# Build docs without CUDA for docs.rs
no-default-features = true
